name: cd

on: [push, pull_request]

jobs:
  cd:
    runs-on: ubuntu-latest  # 不再需要 matrix，因为只用一个版本

    steps:
      - name: Checkout
        uses: actions/checkout@v4   # 升级到最新稳定版

      - name: Setup node env
        uses: actions/setup-node@v4  # 升级到最新版
        with:
          node-version: 20          # 使用 Node.js 20 LTS（或 18）
          cache: 'npm'              # 启用 npm 缓存，加速安装

      - name: Install dependencies
        run: npm ci                 # 推荐使用 ci，更快且严格遵循 lockfile

      - name: Generate
        run: npm run generate

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.API_TOKEN_GITHUB2 }}
          publish_dir: ./.output/public   # ✅ 修正路径，Nuxt 默认输出到 .output/public
          # 如果需要保留 .nojekyll 文件，请确保它在构建输出目录中